<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f4">
  <title>Undercover</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="light">

  <!-- Page [accueil] -->
  <main id="home" class="screen">
    <header class="topbar">
      <div class="langs" role="group" aria-label="Langue">
        <button class="lang" data-lang="fr">FR</button>
        <button class="lang" data-lang="en">EN</button>
        <button class="lang" data-lang="la">LA</button>
      </div>
    </header>
    <h1 id="title">Undercover</h1>

    <section>
      <h2 data-i18n="themes">Thèmes</h2>
      <div id="themes" class="themes"></div>
    </section>

    <section>
      <h2 data-i18n="players">Joueurs</h2>
      <div id="wheel" class="wheel" aria-label="Nombre de joueurs"></div>
    </section>

    <button id="start" class="btn primary" disabled data-i18n="start">Lancer la partie</button>
    <p id="error" class="error" hidden></p>
  </main>

  <!-- Page [joueur] -->
  <main id="player" class="screen" hidden>
    <h1 id="player-name"></h1>
    <button id="see" class="btn primary" data-i18n="see">Voir le mot</button>
  </main>

  <!-- Page [mot] -->
  <main id="word" class="screen" hidden>
    <p id="word-text" class="word"></p>
    <button id="next" class="btn primary" data-i18n="next">Suivant</button>
  </main>

  <!-- Page [rejouer] -->
  <main id="end" class="screen" hidden>
    <h1 data-i18n="done">Tout le monde a son mot</h1>
    <button id="replay" class="btn primary" data-i18n="replay">Rejouer</button>
    <button id="back" class="btn secondary" data-i18n="home">Accueil</button>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
